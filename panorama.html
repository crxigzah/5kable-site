<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body, #pano {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #0d0d18;
  }
  #pano-error {
    display: none;
    color: #8888aa;
    font: 12px -apple-system, sans-serif;
    text-align: center;
    padding-top: 90px;
  }
</style>
</head>
<body>
  <div id="pano"></div>
  <div id="pano-error">Panorama unavailable</div>
  <!-- Cache-busting query param: bump this (v=2, v=3, ...) any time
       panorama.js is edited, so browsers/CDNs that have already cached the
       old file are forced to fetch the new one instead of silently reusing
       a stale copy. -->
  <script src="panorama.js?v=1"></script>
</body>
</html>
